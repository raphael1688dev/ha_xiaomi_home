name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  check-rule-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-dependency zeroconf paho.mqtt psutil cryptography slugify aiohttp

      - name: Check rule format with pytest
        run: |
          pytest -v -s -m github ./test/check_rule_format.py

      - name: Unit test with pytest
        run: |
          pytest -v -s -m github ./test/

  # The fork's own unit tests import Home Assistant, so they get a job with
  # Home Assistant installed. Keep the version in step with the local test_env.
  fork-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install Home Assistant and the test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install homeassistant==2026.11.1
          # Pin shared packages (paho-mqtt among them) to the versions
          # Home Assistant ships, as a real installation has them
          constraints="$(python -c 'import homeassistant, os; print(os.path.join(os.path.dirname(homeassistant.__file__), "package_constraints.txt"))')"
          pip install -c "$constraints" pytest pytest-asyncio pytest-dependency psutil paho-mqtt

      - name: Unit test the fork with pytest
        run: |
          pytest -q tests/
