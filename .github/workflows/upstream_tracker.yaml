name: Upstream Release Tracker

on:
  schedule:
    # Run daily at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  check-upstream:
    name: Check Upstream Releases
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Upstream Tracker
        id: tracker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/check_upstream.py

      - name: Create Tracking Issue If New Release Detected
        if: steps.tracker.outputs.has_new_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tracker.outputs.new_tag }}"
          # Check if an open issue for this tag already exists to avoid duplicates
          EXISTING_ISSUE=$(gh issue list --repo ${{ github.repository }} --state open --search "$TAG" --json number -q '.[0].number')
          if [ -n "$EXISTING_ISSUE" ]; then
            echo "An open tracking issue already exists (#$EXISTING_ISSUE) for $TAG. Skipping creation."
          else
            gh issue create \
              --repo ${{ github.repository }} \
              --title "[Upstream Sync] Official Xiaomi release $TAG detected" \
              --body-file upstream_report.md
            echo "Created tracking issue for $TAG."
          fi
