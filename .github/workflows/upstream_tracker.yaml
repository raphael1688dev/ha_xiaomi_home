name: Upstream Release Tracker

on:
  schedule:
    # Run daily at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  check-upstream:
    name: Check Upstream Releases
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Upstream Tracker
        id: tracker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/check_upstream.py

      - name: Create Tracking Issue If New Release Detected
        if: steps.tracker.outputs.has_new_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tracker.outputs.new_tag }}"
          TITLE="[Upstream Sync] Official Xiaomi release $TAG detected"
          # Match the exact title in open AND closed issues, so a closed issue
          # (triaged but .upstream_version not yet bumped) is not recreated daily
          EXISTING_ISSUE=$(gh issue list --repo ${{ github.repository }} --state all \
            --search "\"$TITLE\" in:title" --limit 50 --json number,title \
            | jq -r --arg t "$TITLE" '[.[] | select(.title == $t)][0].number // empty')
          if [ -n "$EXISTING_ISSUE" ]; then
            echo "A tracking issue already exists (#$EXISTING_ISSUE) for $TAG. Skipping creation."
          else
            gh issue create \
              --repo ${{ github.repository }} \
              --title "$TITLE" \
              --body-file upstream_report.md
            echo "Created tracking issue for $TAG."
          fi
